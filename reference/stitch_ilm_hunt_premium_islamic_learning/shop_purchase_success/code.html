<script>
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#4edea3', '#e9c349', '#b4c5ff', '#ffffff'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const size = Math.random() * 8 + 4;
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 2;
                
                confetti.style.backgroundColor = color;
                confetti.style.left = `${left}vw`;
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size}px`;
                confetti.style.animation = `fall ${duration}s linear ${delay}s infinite`;
                confetti.style.boxShadow = `0 0 10px ${color}88`;
                
                container.appendChild(confetti);
            }
        }

        // Initialize confetti
        window.addEventListener('DOMContentLoaded', createConfetti);

        // Subtle parallax effect on the card
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('main');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
