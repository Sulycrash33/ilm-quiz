<style>
    .glass-card {
      background: rgba(45, 52, 73, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

      border-color: rgba(78, 222, 163, 0.5);

      box-shadow: 0 0 15px rgba(233, 195, 73, 0.3);
    }

    @keyframes pulse-emerald {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .animate-pulse-subtle {
      animation: pulse-emerald 3s infinite ease-in-out;
    }

<!-- Background Ambience Effects -->
<div class="fixed top-1/4 -right-20 w-80 h-80 bg-primary/10 blur-[120px] rounded-full -z-10 animate-pulse-subtle"></div>
<div class="fixed bottom-1/4 -left-20 w-80 h-80 bg-tertiary/10 blur-[120px] rounded-full -z-10"></div>
<script>
    // Micro-interactions for quiz selection
    document.querySelectorAll('button.glass-card').forEach(btn => {
      btn.addEventListener('click', () => {
        // Simple visual feedback before potential logic
        document.querySelectorAll('button.glass-card').forEach(b => {
          b.classList.remove('border-primary', 'bg-primary/10');
        });
        btn.classList.add('border-primary', 'bg-primary/10');
      });
    });

    // Countdown Simulation
    let timeLeft = 15;
    const timerDisplay = document.querySelector('.timer-glow .font-bold');
    
    const timerInterval = setInterval(() => {
      timeLeft--;
      if(timeLeft >= 0) {
        timerDisplay.textContent = timeLeft + 's';
        if(timeLeft <= 5) {
          timerDisplay.parentElement.classList.remove('text-tertiary');
          timerDisplay.parentElement.classList.add('text-error', 'animate-pulse');
        }
      } else {
        clearInterval(timerInterval);
      }
    }, 1000);
  </script>
