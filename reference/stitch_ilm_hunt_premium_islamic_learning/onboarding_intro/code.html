<style>
        .glass-surface {
            background: rgba(45, 52, 73, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .mashrabiya-overlay {
            background-image: radial-gradient(#10b981 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            opacity: 0.05;
        }

        .premium-glow {
            box-shadow: 0 0 40px -10px rgba(78, 222, 163, 0.3);
        }

        .btn-gloss {
            position: relative;
            overflow: hidden;
        }

        .btn-gloss::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: gloss-shimmer 4s infinite linear;
        }

        @keyframes gloss-shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .float-animation {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
<style>
    body {

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden">

</div>
</div>

<script>
        // Micro-interaction: Subtle parallax on mouse/tilt
        document.addEventListener('mousemove', (e) => {
            const illustration = document.querySelector('.float-animation');
            if (illustration) {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
                illustration.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg) translateY(-10px)`;
            }
        });

        // Simple button active state handle
        const primaryBtn = document.querySelector('button');
        primaryBtn.addEventListener('touchstart', () => {
            primaryBtn.classList.add('opacity-90');
        });
        primaryBtn.addEventListener('touchend', () => {
            primaryBtn.classList.remove('opacity-90');
        });
    </script>
