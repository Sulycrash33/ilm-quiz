<script>
    // WebGL Shader Integration
    const canvas = document.getElementById('shader-canvas');
    const gl = canvas.getContext('webgl');

    if (gl) {
        const vertexShaderSource = `
            attribute vec2 a_position;
            varying vec2 v_texCoord;
            void main() {
                v_texCoord = a_position * 0.5 + 0.5;
                gl_Position = vec4(a_position, 0.0, 1.0);
            }
        `;

        const fragmentShaderSource = `
            precision highp float;
            varying vec2 v_texCoord;
            uniform float u_time;
            uniform vec2 u_resolution;

            void main() {
                vec2 uv = v_texCoord;
                
                // Create a flowing, ethereal background
                float color1 = sin(uv.x * 3.0 + u_time * 0.5) * 0.5 + 0.5;
                float color2 = cos(uv.y * 3.0 - u_time * 0.3) * 0.5 + 0.5;
                
                vec3 emerald = vec3(0.06, 0.72, 0.50); // #10b981
                vec3 navy = vec3(0.04, 0.07, 0.15);    // #0b1326
                vec3 blue = vec3(0.12, 0.22, 0.30);    // Dark Blue
                
                vec3 finalColor = mix(navy, emerald * 0.2, color1);
                finalColor = mix(finalColor, blue * 0.3, color2);
                
                // Add subtle grain/noise
                float noise = fract(sin(dot(uv, vec2(12.9898, 78.233))) * 43758.5453);
                finalColor += noise * 0.02;
                
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vertexShaderSource));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

        const positionLocation = gl.getAttribLocation(program, "a_position");
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        const timeLocation = gl.getUniformLocation(program, "u_time");
        const resolutionLocation = gl.getUniformLocation(program, "u_resolution");

        function render(time) {
            time *= 0.001;
            
            if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }

            gl.uniform1f(timeLocation, time);
            gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    }
</script>
