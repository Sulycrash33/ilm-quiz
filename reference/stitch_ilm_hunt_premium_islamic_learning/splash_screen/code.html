<!-- Interactive Atmosphere Script -->
<script>
        // Simple parallax for the logo based on mouse movement
        document.addEventListener('mousemove', (e) => {
            const logo = document.querySelector('.logo-container');
            if (logo) {
                const moveX = (e.clientX - window.innerWidth / 2) / 50;
                const moveY = (e.clientY - window.innerHeight / 2) / 50;
                logo.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });

        // Loading bar custom animation via JS if keyframes aren't enough
        const loadingBar = document.querySelector('.animate-\\[loading_2s_ease-in-out_infinite\\]');
        let progress = 0;
        const animateLoading = () => {
            progress = (progress + 0.5) % 100;
            // The tailwind class handles the loop, this is just for safety/hooking
            requestAnimationFrame(animateLoading);
        };
        requestAnimationFrame(animateLoading);
    </script>
<style>
        @keyframes loading {
            0% { left: -30%; width: 30%; }
            50% { left: 40%; width: 50%; }
            100% { left: 100%; width: 30%; }
